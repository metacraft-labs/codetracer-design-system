name: Downstream

# The downstream lane: before a token change reaches `dev`, run each
# consumer's own token gates against it. Every consumer pins a revision of
# this repository (codetracer and codetracer-ci as a git submodule,
# codetracer-web-site as a flake input), so their own CI sees a token change
# only when someone bumps the pin. This lane moves the pin to the candidate in
# a scratch copy of each consumer and runs, through
# scripts/downstream/consumers.lane.mjs:
#
#   codetracer           `just sync-design-tokens`, then
#                        ci/test/design-tokens-fresh.sh with the candidate
#                        staged as the submodule pin, then
#                        scripts/check-token-refs.mjs over its stylesheets for
#                        every generated variable the candidate drops
#   codetracer-ci        scripts/generate-design-tokens.py --check
#   codetracer-web-site  `just test` in its `ci` dev shell, with
#                        DESIGN_SYSTEM_SRC pointing at the candidate
#
# The log ends with a `TEST-COUNTS:` line, one test per gate, and the command
# is the one a developer runs locally with the consumers checked out beside
# this repository, so a failure reproduces with it.
on:
  push:
    # The mainline. `agents` runs no CI by policy; work landing there runs
    # the lane locally and is measured here when it is promoted to `dev`.
    branches: [dev]
  pull_request:
    # Named base: an unfiltered trigger would also run on pull requests into
    # `agents`, which runs no CI.
    branches: [dev]
  workflow_dispatch:
    inputs:
      codetracer_ref:
        description: codetracer ref to test against (default its agent landing branch, agents)
        required: false
        default: agents
      codetracer_ci_ref:
        description: codetracer-ci ref to test against (default its agent landing branch, agents)
        required: false
        default: agents
      web_site_ref:
        description: codetracer-web-site ref to test against (default its mainline, dev; it has no agents branch)
        required: false
        default: dev

permissions:
  contents: read

# Cancel superseded pull-request runs only; every other event gets a group
# unique to its run, so a mainline run is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # One leg, Linux x64, by documented exception to the five-leg matrix. The
  # omitted legs are Linux arm64, macOS arm64, Windows x64 and Windows arm64.
  # The reason: the gates resolve token JSON into text (stylus, a Nim module,
  # CSS) with bash, python3, Node.js and Nim programs whose output does not
  # depend on the OS or architecture, and the consumers' own CI runs their
  # platform legs once the pin moves. The macOS and Windows legs are the
  # scarce ones.
  downstream:
    name: Downstream (${{ join(matrix.runner, '-') }})
    strategy:
      fail-fast: false
      matrix:
        runner:
          - [self-hosted, linux, x64]
    runs-on: ${{ matrix.runner }}
    steps:
      # codetracer-ci and codetracer-web-site are private; the CI token
      # provider app can read them. The app id is the per-repo secret once the
      # repository is registered with the token provider; until then this
      # public repository reads the org variable (which a private one could not).
      - name: Generate CI token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID || vars.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Fails if the branch filters above stop naming the mainline, which
      # would otherwise make this workflow stop running without any error.
      - name: Workflow triggers name the mainline
        uses: metacraft-labs/metacraft-github-actions/assert-workflow-triggers@dev
        with:
          mainline: dev
      # Configures nix.conf and verifies flakes are enabled. The token lets
      # Nix fetch the web site's pinned flake inputs. cachix/install-nix-action
      # must not be used on these runners.
      - uses: metacraft-labs/devops-modules/.github/setup-nix@dev
        with:
          nix-github-token: ${{ steps.app-token.outputs.token }}
      # Each consumer is cloned where the lane looks for it by default, the
      # workspace sibling `../<name>`, at its agent landing branch: the
      # changes that move together with this repository's land there.
      # The names and default branches are CONSUMERS in
      # scripts/downstream/lane.mjs; scripts/downstream-lane.test.mjs checks
      # that this list matches it.
      - name: Clone codetracer
        uses: metacraft-labs/metacraft-github-actions/clone-repo@dev
        with:
          repo: metacraft-labs/codetracer
          ref: ${{ github.event.inputs.codetracer_ref || 'agents' }}
          path: ${{ github.workspace }}/../codetracer
          gh-token: ${{ steps.app-token.outputs.token }}
      - name: Clone codetracer-ci
        uses: metacraft-labs/metacraft-github-actions/clone-repo@dev
        with:
          repo: metacraft-labs/codetracer-ci
          ref: ${{ github.event.inputs.codetracer_ci_ref || 'agents' }}
          path: ${{ github.workspace }}/../codetracer-ci
          gh-token: ${{ steps.app-token.outputs.token }}
      - name: Clone codetracer-web-site
        uses: metacraft-labs/metacraft-github-actions/clone-repo@dev
        with:
          repo: metacraft-labs/codetracer-web-site
          ref: ${{ github.event.inputs.web_site_ref || 'dev' }}
          path: ${{ github.workspace }}/../codetracer-web-site
          gh-token: ${{ steps.app-token.outputs.token }}
      - name: node scripts/run-tests.mjs scripts/downstream/consumers.lane.mjs
        # An explicit `shell: bash` runs with `-o pipefail`, so `tee` cannot
        # hide a failing gate. The tools come from nixpkgs: the self-hosted
        # Linux runners are NixOS, where downloaded glibc binaries do not start.
        shell: bash
        run: |
          mkdir -p test-logs
          nix shell nixpkgs#nodejs_24 nixpkgs#python3 nixpkgs#just --command bash -c \
            'node --version && node scripts/run-tests.mjs scripts/downstream/consumers.lane.mjs' \
            2>&1 | tee test-logs/downstream.log
      # A short-lived convenience copy; the durable copy is the in-house S3
      # store below.
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: downstream-logs-${{ join(matrix.runner, '-') }}
          path: test-logs/
          retention-days: 1
      - name: Mirror artifacts to S3 (non-blocking)
        if: always()
        continue-on-error: true
        shell: bash
        env:
          MCL_S3_ARTIFACTS_ENDPOINT: ${{ vars.MCL_S3_ARTIFACTS_ENDPOINT }}
          MCL_S3_ARTIFACTS_BUCKET: ${{ vars.MCL_S3_ARTIFACTS_BUCKET }}
          MCL_S3_ARTIFACTS_REGION: ${{ vars.MCL_S3_ARTIFACTS_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.MCL_S3_ARTIFACTS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MCL_S3_ARTIFACTS_SECRET_ACCESS_KEY }}
          AWS_EC2_METADATA_DISABLED: "true"
          S3_OBJECT_PREFIX: downstream-logs/${{ github.run_id }}/${{ join(matrix.runner, '-') }}
        run: |
          set -u
          if [[ -z "${AWS_ACCESS_KEY_ID:-}" || -z "${MCL_S3_ARTIFACTS_ENDPOINT:-}" ]]; then
            echo "S3 artifact store not configured for this repo; skipping mirror."
            exit 0
          fi
          nix shell nixpkgs#awscli2 -c \
            aws --endpoint-url "$MCL_S3_ARTIFACTS_ENDPOINT" \
                --region "${MCL_S3_ARTIFACTS_REGION:-garage}" \
                s3 cp --recursive test-logs/ \
                "s3://${MCL_S3_ARTIFACTS_BUCKET:-ci-artifacts}/$S3_OBJECT_PREFIX/" \
            || echo "::warning title=S3 artifact mirror::upload failed (non-blocking)"
